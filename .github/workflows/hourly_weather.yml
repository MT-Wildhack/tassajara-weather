name: Hourly Tassajara Weather MOS Pipeline
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tassajara MOS Pipeline
        env:
          WL_API_KEY: "tigkhjhsweahdrae2cl0uenfuws3kv8k"
          WL_API_SECRET: "ffnphp69pdbsqwsahkdewvctewmxagwt"
        run: python run_hourly_mos_pipeline.py

      - name: Save Updated Database Back to Repository
        run: |
          git config user.name "Tassajara Weather Bot"
          git config user.email "weather-bot@tassajara.local"
          git add tassajara_weather.db
          git diff --staged --quiet || (git commit -m "Hourly weather & MOS update" && git push)
